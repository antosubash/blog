# External link check (lychee), used by .github/workflows/links.yml and locally:
#   pnpm build && lychee --root-dir "$PWD/dist" 'dist/**/*.html'
# Internal links are checked offline by scripts/ci/check-dist.mjs on every PR.

# 206 = partial content (media), 429 = rate limited: the link exists.
accept = ["200", "206", "429"]
max_concurrency = 16
max_retries = 2
retry_wait_time = 4
timeout = 30
cache = true
max_cache_age = "2d"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
exclude_all_private = true
include_mail = false

exclude = [
  # Local and placeholder hosts used in code samples and prose.
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  '^https?://0\.0\.0\.0',
  '^https?://([a-z0-9-]+\.)*example\.(com|org|net)',
  '^https?://[^/]*\.local(host)?(:\d+)?(/|$)',
  '^https?://host\.docker\.internal',
  # "Edit on GitHub" links are generated for every post and point at main, where a
  # post only exists once it is merged.
  '^https://github\.com/antosubash/blog/blob/main/content/',
  # Sites that block or rate-limit bots, so they always fail in CI.
  '^https?://([a-z]+\.)?linkedin\.com',
  '^https?://(www\.)?(twitter|x)\.com',
  '^https?://(www\.)?medium\.com',
  '^https?://(www\.)?stackoverflow\.com',
  '^https?://(www\.)?npmjs\.com',
  # Resource hints and embeds, not navigable links.
  '^https?://fonts\.(googleapis|gstatic)\.com',
  '^https?://(www\.)?youtube\.com/embed/',
  '^https?://utteranc\.es',
  '^https?://www\.googletagmanager\.com',
]
