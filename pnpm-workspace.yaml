packages: ["video", "tools/diagrams"]

onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  # Only used by tools/diagrams; its postinstall downloads a Chrome. The render
  # script uses the system Chrome instead (CHROME_PATH to override).
  puppeteer: false
# Security overrides for transitive dependencies (see the PR for each advisory).
overrides:
  toml: ^5.0.1
  uuid@<11.1.1: ^11.1.1
  postcss-selector-parser@<6.1.5: ^6.1.5
  minimatch@>=10 <11.0.1: ^11.0.1
  katex: ^0.18.2
  fflate@<0.7.5: ^0.7.5
