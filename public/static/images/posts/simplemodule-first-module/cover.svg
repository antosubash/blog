<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>A bookmarks module with its table, migration, API, page and test, plugged into a host app</title>
  <desc>A bookmarks module with its table, migration, API, page and test, plugged into a host app</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#807a74" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#1f1b17"/>
  <rect width="1200" height="630" rx="24" fill="url(#dots)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600">
    <!-- the module -->
    <rect x="96" y="56" width="1008" height="324" rx="16" fill="rgba(192,120,64,0.15)" stroke="#c07840" stroke-width="4"/>
    <text x="600" y="122" text-anchor="middle" font-size="40" fill="#ede8e3">bookmarks</text>

    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" fill="#ede8e3" text-anchor="middle">
      <rect x="136" y="170" width="168" height="72" rx="10" fill="#2a2520" stroke="#c07840" stroke-width="2"/>
      <text x="220" y="216">table</text>
      <rect x="328" y="170" width="168" height="72" rx="10" fill="#2a2520" stroke="#c07840" stroke-width="2"/>
      <text x="412" y="216">migrate</text>
      <rect x="520" y="170" width="168" height="72" rx="10" fill="#2a2520" stroke="#c07840" stroke-width="2"/>
      <text x="604" y="216">api</text>
      <rect x="712" y="170" width="168" height="72" rx="10" fill="#2a2520" stroke="#c07840" stroke-width="2"/>
      <text x="796" y="216">page</text>
      <rect x="904" y="170" width="160" height="72" rx="10" fill="#2a2520" stroke="#5fa8a0" stroke-width="2"/>
      <text x="984" y="216">test</text>
    </g>

    <!-- arrows between steps -->
    <g stroke="#807a74" stroke-width="3" stroke-linecap="round">
      <line x1="306" y1="206" x2="326" y2="206"/>
      <line x1="498" y1="206" x2="518" y2="206"/>
      <line x1="690" y1="206" x2="710" y2="206"/>
      <line x1="882" y1="206" x2="902" y2="206"/>
    </g>

    <text x="600" y="320" text-anchor="middle" font-size="30" fill="#807a74" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">smpy create-module bookmarks</text>

    <!-- connector -->
    <line x1="600" y1="380" x2="600" y2="452" stroke="#c07840" stroke-width="4" stroke-linecap="round"/>

    <!-- host bar -->
    <rect x="96" y="452" width="1008" height="104" rx="16" fill="#2a2520" stroke="#5fa8a0" stroke-width="3"/>
    <text x="600" y="518" text-anchor="middle" font-size="36" fill="#ede8e3">one FastAPI + Inertia app</text>
  </g>
</svg>
