<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>Three streams of processes pass a headroom gate before they reach a RAM gauge that stays below its limit</title>
  <desc>On the left, three lanes of process blocks: orphaned workers, pytest workers and MCP servers. Each lane runs into a copper gate labelled headroom; two lanes have a block waiting in front of it. Past the gate, a tall RAM gauge is filled a little over half, below a dashed limit line.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#807a74" opacity="0.14"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#807a74"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#1f1b17"/>
  <rect width="1200" height="630" rx="24" fill="url(#dots)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="500" fill="#807a74">
    <text x="80" y="128">orphans</text>
    <text x="80" y="288">pytest -n</text>
    <text x="80" y="448">mcp</text>
  </g>

  <!-- lanes of process blocks -->
  <g fill="#2a2520" stroke="#3d3832" stroke-width="3">
    <rect x="80" y="150" width="40" height="40" rx="10"/><rect x="132" y="150" width="40" height="40" rx="10"/><rect x="184" y="150" width="40" height="40" rx="10"/><rect x="236" y="150" width="40" height="40" rx="10"/><rect x="288" y="150" width="40" height="40" rx="10"/>
    <rect x="80" y="310" width="40" height="40" rx="10"/><rect x="132" y="310" width="40" height="40" rx="10"/><rect x="184" y="310" width="40" height="40" rx="10"/><rect x="236" y="310" width="40" height="40" rx="10"/><rect x="288" y="310" width="40" height="40" rx="10"/><rect x="340" y="310" width="40" height="40" rx="10"/>
    <rect x="80" y="470" width="40" height="40" rx="10"/><rect x="132" y="470" width="40" height="40" rx="10"/><rect x="184" y="470" width="40" height="40" rx="10"/><rect x="236" y="470" width="40" height="40" rx="10"/>
  </g>
  <g stroke="#807a74" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round" fill="none" marker-end="url(#arrow)">
    <path d="M344 170 H520"/>
    <path d="M396 330 H520"/>
    <path d="M292 490 H596"/>
  </g>
  <!-- queued blocks waiting at the gate -->
  <g fill="#2a2520" stroke="#807a74" stroke-width="3">
    <rect x="544" y="150" width="40" height="40" rx="10"/>
    <rect x="544" y="310" width="40" height="40" rx="10"/>
  </g>

  <!-- the headroom gate -->
  <text x="636" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#c07840">headroom</text>
  <rect x="612" y="110" width="48" height="430" rx="14" fill="rgba(192,120,64,0.15)" stroke="#c07840" stroke-width="4"/>
  <g stroke="#c07840" stroke-width="4" stroke-linecap="round">
    <line x1="624" y1="150" x2="648" y2="150"/><line x1="624" y1="250" x2="648" y2="250"/>
    <line x1="624" y1="350" x2="648" y2="350"/><line x1="624" y1="450" x2="648" y2="450"/>
  </g>
  <path d="M676 330 H818" stroke="#c07840" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M812 316 L834 330 L812 344z" fill="#c07840"/>

  <!-- RAM gauge -->
  <rect x="860" y="110" width="220" height="430" rx="18" fill="#2a2520" stroke="#3d3832" stroke-width="3"/>
  <rect x="872" y="300" width="196" height="228" rx="10" fill="rgba(192,120,64,0.15)"/>
  <line x1="872" y1="300" x2="1068" y2="300" stroke="#c07840" stroke-width="4" stroke-linecap="round"/>
  <line x1="848" y1="180" x2="1092" y2="180" stroke="#807a74" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="970" y="590" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#ede8e3">RAM</text>
  <text x="970" y="80" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="500" fill="#807a74">limit</text>
  <line x1="970" y1="92" x2="970" y2="170" stroke="#807a74" stroke-width="2"/>
</svg>
