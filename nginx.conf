server {
  listen 3000;
  root /usr/share/nginx/html;

  # /posts/foo -> /posts/foo/index.html, without redirecting to a trailing slash.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Tags merged into their lowercase form (same redirects as vercel.json).
  location = /tags/Llama { return 301 /tags/llama; }
  location = /tags/Llama/feed.xml { return 301 /tags/llama/feed.xml; }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
