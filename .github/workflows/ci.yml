name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm 12 is what the lockfile was written with. Not pinned via
      # "packageManager": pnpm 12 would then add a packageManagerDependencies
      # document to pnpm-lock.yaml that older pnpm (Vercel) cannot read.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Check dist (internal links, drafts, feeds, OG images)
        run: node scripts/ci/check-dist.mjs dist content/posts

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3
